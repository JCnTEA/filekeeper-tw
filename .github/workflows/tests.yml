# 持續整合：每次推送都跑一次核心邏輯測試
# 僅測試不開視窗的核心模組，因此不需要虛擬顯示器

name: 測試

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 單元測試（${{ matrix.os }}／Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只挑確定有對應 Python 版本的組合（例如 Ubuntu 26.04 沒有 Python 3.9）
        include:
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 執行單元測試
        run: python -m unittest discover -s tests -v
